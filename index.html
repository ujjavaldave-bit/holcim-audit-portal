        :root {

            --background: #f4f6f8;
            --text-primary: #1a1a2e;
            --border: #e2e6eb;
            --success: #94c12e;
            --danger: #dc2626;
            --radius-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--background); padding: 20px; color: var(--text-primary); transition: direction 0.3s; }
        
        #ssoOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--background); z-index: 10000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
        }

        .container { max-width: 950px; margin: 0 auto; display: none; } 
        .card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 20px 50px rgba(29,67,112,0.12); overflow: hidden; animation: slideUp 0.4s ease-out; }
        
        .header { background: var(--holcim-gradient); padding: 30px; text-align: center; color: white; position: relative; }
        .holcim-logo { height: 45px; filter: brightness(0) invert(1); margin-bottom: 10px; }
        
        .lang-nav { position: absolute; top: 15px; right: 20px; }
        
        /* FIXED: Added background and dark text color for visibility */
        #languagePicker { 
            background: white !important; 
            color: #1d4370 !important; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; outline: none; font-weight: 700;
        }

        .form-body { padding: 32px; }
        .audit-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .form-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; outline: none; font-family: inherit; }

        .jump-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid var(--border); justify-content: center; }
        .jump-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .jump-btn.active { background: var(--holcim-blue); color: white; border-color: var(--holcim-blue); }
        .jump-btn.completed { background: #ecfdf5; color: var(--success); border-color: var(--success); }
        .jump-btn.failed-step { background: #fef2f2; color: var(--danger); border-color: var(--danger); }

        .progress-bg { height: 8px; background: #e2e6eb; border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        #progressBar { height: 100%; background: var(--holcim-gradient); width: 0%; transition: 0.4s ease; }

        .audit-step { display: none; }
        .audit-step.active { display: block; animation: fadeIn 0.3s; }

        .section-card { border: 1px solid var(--border); border-radius: 16px; padding: 24px; background: #fafbfc; position: relative; }
        .section-title { font-weight: 700; color: var(--holcim-blue); font-size: 18px; margin-bottom: 15px; display: block;}

        .checklist-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .checklist-table th { background: #f8fafc; padding: 12px; text-align: center; font-size: 10px; text-transform: uppercase; color: #64748b; border-bottom: 1px solid var(--border); }
        .checklist-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        
        .help-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #e2e6eb; border-radius: 50%; font-size: 12px; font-weight: bold; cursor: help; margin-left: 8px; color: #1d4370; }
        .help-text { display: none; font-size: 12px; color: #555; font-style: italic; margin-top: 8px; background: #f0f7ff; padding: 10px; border-radius: 8px; border-left: 4px solid var(--holcim-blue); line-height: 1.4; }

        .upload-zone { margin-top: 15px; border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; color: #666; cursor: pointer; background: white; transition: 0.3s; }
        .upload-zone.required-error { border-color: var(--danger); background: #fff5f5; border-width: 3px; animation: shake 0.5s; }

        .nav-buttons { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.3s; font-family: inherit; }
        .btn-primary { background: var(--holcim-gradient); color: white; }
        .btn-outline { border: 2px solid var(--holcim-blue); color: var(--holcim-blue); background: white; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>

        { "region": "Latin America", "country": "Mexico", "code": "es" },
        { "region": "Latin America", "country": "Nicaragua", "code": "es" },
        { "region": "Latin America", "country": "Peru", "code": "es" },
        { "region": "Middle East & Africa", "country": "Algeria", "code": "fr" },
        { "region": "Middle East & Africa", "country": "Cameroon", "code": "fr" },
        { "region": "Middle East & Africa", "country": "Egypt", "code": "ar" },
        { "region": "Middle East & Africa", "country": "Iraq", "code": "ar" },
        { "region": "Middle East & Africa", "country": "Jordan", "code": "ar" },
        { "region": "Middle East & Africa", "country": "Lebanon", "code": "ar" },
        { "region": "Middle East & Africa", "country": "Morocco", "code": "fr" },
        { "region": "Asia Pacific", "country": "Australia", "code": "en" },
        { "region": "Asia Pacific", "country": "New Zealand", "code": "en" },
        { "region": "Asia Pacific", "country": "Bangladesh", "code": "bn" }
    ]
};

    let state = {
        currentStep: 0,
        currentLang: 'en',
        auditSerial: "AUD-" + Math.floor(100000 + Math.random() * 900000),
        auditData: [],
        ssoToken: null
    };

    function handleCredentialResponse(response) {
        state.ssoToken = response.credential;
        document.getElementById('ssoOverlay').style.display = 'none';
        document.getElementById('auditMain').style.display = 'block';
        populateLanguagePicker();
        setLanguage('en');
    }

    function populateLanguagePicker() {
        const picker = document.getElementById('languagePicker');
        // FIXED: Pulling from the markets array in your JSON
        picker.innerHTML = auditJson.markets.map(m => 
            `<option value="${m.code}">${m.country}</option>`
        ).join('');
    }

    function setLanguage(lang) {
        state.currentLang = lang;
        // FIXED: Looking into auditJson.languages[lang]
        const t = auditJson.languages[lang] || auditJson.languages['en'];
        
        document.getElementById('portalTitle').innerText = t.portalTitle;
        document.getElementById('lblOrder').innerText = t.lblOrder;
        document.getElementById('lblAuditee').innerText = t.lblAuditee;
        document.getElementById('lblParticipants').innerText = t.lblParticipants;
        document.getElementById('btnDraft').innerText = t.btnDraft;
        document.getElementById('serialDisplay').innerText = t.lblSerial + " " + state.auditSerial;
        
        // Initialize data based on English structure to ensure 11 steps
        if (state.auditData.length === 0) {
            state.auditData = auditJson.languages['en'].sections.map(s => ({ 
                status: 'PENDING', 
                answers: s.qs.map(() => null), 
                file: false 
            }));
        }
        initWizard();
    }

    function initWizard() {
        const t = auditJson.languages[state.currentLang] || auditJson.languages['en'];
        const enTemplate = auditJson.languages['en']; 
        const container = document.getElementById('stepsContainer');
        container.innerHTML = '';
        renderJumpMenu(enTemplate);

        // Always loop through 11 sections based on English template
        enTemplate.sections.forEach((sectionEn, idx) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = `audit-step ${idx === state.currentStep ? 'active' : ''}`;
            
            // Get local section title and questions if available
            const localSection = t.sections[idx] || sectionEn;

            const tableRows = sectionEn.qs.map((itemEn, qIdx) => {
                const localQ = localSection.qs[qIdx] || itemEn;
                return `
                <tr>
                    <td>
                        <div style="display:flex; align-items:center;">
                            <strong>${localQ.q}</strong>
                            <span class="help-icon" onclick="toggleHelp(${idx}, ${qIdx})">?</span>
                        </div>
                        <div id="help-${idx}-${qIdx}" class="help-text">${localQ.h}</div>
                    </td>
                    <td style="text-align:center"><input type="radio" name="q_${idx}_${qIdx}" onclick="updateLogic(${idx}, ${qIdx}, 'Pass')" ${state.auditData[idx].answers[qIdx] === 'Pass' ? 'checked' : ''}></td>
                    <td style="text-align:center"><input type="radio" name="q_${idx}_${qIdx}" onclick="updateLogic(${idx}, ${qIdx}, 'Fail')" ${state.auditData[idx].answers[qIdx] === 'Fail' ? 'checked' : ''}></td>
                </tr>`;
            }).join('');

            stepDiv.innerHTML = `
                <div class="section-card">
                    <span class="section-title">${idx + 1}. ${localSection.title}</span>
                    <table class="checklist-table">
                        <thead><tr><th>${t.requirement}</th><th>${t.pass}</th><th>${t.fail}</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                    <div id="zone-${idx}" class="upload-zone ${state.auditData[idx].status === 'Fail' && !state.auditData[idx].file ? 'required-error' : ''}" onclick="this.querySelector('input').click()">
                        <span id="uploadText-${idx}">${state.auditData[idx].file ? '✅ Artifact Uploaded' : t.artifactReq}</span>
                        <input type="file" style="display:none" onchange="handleFile(${idx}, this)">
                    </div>
                </div>`;
            container.appendChild(stepDiv);
        });
        updateUI();
    }

    function renderJumpMenu(template) {
        const menu = document.getElementById('jumpMenu');
        menu.innerHTML = template.sections.map((s, i) => `
            <button type="button" class="jump-btn ${i === state.currentStep ? 'active' : ''} ${state.auditData[i].status === 'Pass' ? 'completed' : state.auditData[i].status === 'Fail' ? 'failed-step' : ''}" 
            onclick="jumpToStep(${i})">${i + 1}</button>`).join('');
    }

    function jumpToStep(i) { state.currentStep = i; initWizard(); }

    function updateLogic(sIdx, qIdx, result) {
        state.auditData[sIdx].answers[qIdx] = result;
        state.auditData[sIdx].status = state.auditData[sIdx].answers.includes('Fail') ? 'Fail' : state.auditData[sIdx].answers.every(a => a === 'Pass') ? 'Pass' : 'PENDING';
        initWizard();
    }

    function toggleHelp(s, q) {
        const el = document.getElementById(`help-${s}-${q}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function handleFile(idx, input) {
        if (input.files.length > 0) { state.auditData[idx].file = true; initWizard(); }
    }

    function changeStep(n) {
        const enTemplate = auditJson.languages['en'];
        if (n === 1 && (state.auditData[state.currentStep].answers.includes(null) || (state.auditData[state.currentStep].status === 'Fail' && !state.auditData[state.currentStep].file))) {
            alert("Complete all questions and provide artifacts for failures.");
            return;
        }
        state.currentStep += n;
        if (state.currentStep >= enTemplate.sections.length) { saveAudit('COMPLETED'); return; }
        initWizard();
    }

    function updateUI() {
        const t = auditJson.languages[state.currentLang] || auditJson.languages['en'];
        const enTemplate = auditJson.languages['en'];
        const percent = ((state.currentStep + 1) / enTemplate.sections.length) * 100;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('stepLabel').innerText = `Stage ${state.currentStep + 1}: ${enTemplate.sections[state.currentStep].title}`;
        document.getElementById('prevBtn').disabled = (state.currentStep === 0);
        document.getElementById('nextBtn').innerText = (state.currentStep === enTemplate.sections.length - 1) ? t.finalize : t.next;
    }

    async function saveAudit(finalStatus) {
        const payload = {
            serial: state.auditSerial,
            orderNumber: document.getElementById('orderNumber').value,
            auditee: document.getElementById('auditeeName').value,
            participants: document.getElementById('participants').value,
            status: finalStatus,
            results: state.auditData.flatMap((section, sIdx) => 
                section.answers.map((ans, qIdx) => ({
                    section: auditJson.languages['en'].sections[sIdx].title,
                    q: auditJson.languages['en'].sections[sIdx].qs[qIdx].q,
                    res: ans
                }))
            )
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                alert(`SUCCESS: Audit ${state.auditSerial} synced to Aurora.`);
                if(finalStatus === 'COMPLETED') location.reload();
            } else {
                alert("Server error: " + response.status);
            }
        } catch (error) {
            alert("Connection Error: Check if your ngrok and Python backend are running.");
        }
    }
</script>

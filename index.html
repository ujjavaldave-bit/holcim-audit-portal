<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Internal Audit | Holcim Group</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --holcim-blue: #1d4370;
            --holcim-gradient: linear-gradient(135deg, #1d4370 0%, #04bbf1 50%, #94c12e 100%);
            --surface: #ffffff;
            --background: #f4f6f8;
            --text-primary: #1a1a2e;
            --border: #e2e6eb;
            --success: #94c12e;
            --danger: #dc2626;
            --radius-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--background); padding: 20px; color: var(--text-primary); transition: direction 0.3s; }
        
        #ssoOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--background); z-index: 10000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
        }

        .container { max-width: 950px; margin: 0 auto; display: none; } 
        .card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 20px 50px rgba(29,67,112,0.12); overflow: hidden; animation: slideUp 0.4s ease-out; }
        
        .header { background: var(--holcim-gradient); padding: 30px; text-align: center; color: white; position: relative; }
        .holcim-logo { height: 45px; filter: brightness(0) invert(1); margin-bottom: 10px; }
        
        .lang-nav { position: absolute; top: 15px; right: 20px; }
        #languagePicker { 
            background: white !important; 
            color: #1d4370 !important; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; outline: none; font-weight: 700;
        }

        .form-body { padding: 32px; }
        .audit-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .form-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; outline: none; font-family: inherit; }

        .jump-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid var(--border); justify-content: center; }
        .jump-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .jump-btn.active { background: var(--holcim-blue); color: white; border-color: var(--holcim-blue); }
        .jump-btn.completed { background: #ecfdf5; color: var(--success); border-color: var(--success); }
        .jump-btn.failed-step { background: #fef2f2; color: var(--danger); border-color: var(--danger); }

        .progress-bg { height: 8px; background: #e2e6eb; border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        #progressBar { height: 100%; background: var(--holcim-gradient); width: 0%; transition: 0.4s ease; }

        .audit-step { display: none; }
        .audit-step.active { display: block; animation: fadeIn 0.3s; }

        .checklist-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .checklist-table th { background: #f8fafc; padding: 12px; text-align: center; font-size: 10px; text-transform: uppercase; color: #64748b; border-bottom: 1px solid var(--border); }
        .checklist-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; position: relative; }
        
        .help-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #e2e6eb; border-radius: 50%; font-size: 12px; font-weight: bold; cursor: help; margin-left: 8px; color: #1d4370; }
        .help-text { display: none; font-size: 12px; color: #555; font-style: italic; margin-top: 8px; background: #f0f7ff; padding: 10px; border-radius: 8px; border-left: 4px solid var(--holcim-blue); line-height: 1.4; }

        .calendar-trigger { cursor: pointer; font-size: 16px; margin-left: 8px; transition: 0.2s; }
        .calendar-trigger:hover { transform: scale(1.2); }
        .calendar-trigger.date-set { color: var(--success); }

        .nav-buttons { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.3s; font-family: inherit; }
        .btn-primary { background: var(--holcim-gradient); color: white; }
        .btn-outline { border: 2px solid var(--holcim-blue); color: var(--holcim-blue); background: white; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

                </div>
            </form>
        </div>
    </div>

    let state = {
        currentStep: 0,
        currentLang: 'en',
        auditSerial: "AUD-" + Math.floor(100000 + Math.random() * 900000),
        auditData: [],
        userEmail: ""
    };

    function handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        state.userEmail = payload.email.toLowerCase();
        document.getElementById('ssoOverlay').style.display = 'none';
        document.getElementById('auditMain').style.display = 'block';
        populateLanguagePicker();
        setLanguage('en');
    }

    function populateLanguagePicker() {
        const picker = document.getElementById('languagePicker');
        picker.innerHTML = auditJson.markets.map(m => `<option value="${m.code}">${m.country}</option>`).join('');
    }

    function setLanguage(lang) {
        state.currentLang = lang;
        const content = auditJson.languages[lang] || auditJson.languages['en'];
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        document.getElementById('portalTitle').innerText = content.portalTitle;
        document.getElementById('lblOrder').innerText = content.lblOrder;
        document.getElementById('lblAuditee').innerText = content.lblAuditee;
        document.getElementById('lblParticipants').innerText = content.lblParticipants;
        document.getElementById('btnDraft').innerText = content.btnDraft;
        document.getElementById('serialDisplay').innerText = content.lblSerial + " " + state.auditSerial;
        if (state.auditData.length === 0) {
            state.auditData = auditJson.languages['en'].sections.map(s => ({ status: 'PENDING', answers: s.qs.map(() => null), file: false }));
        }
        initWizard();
    }

    function initWizard() {
        const t = auditJson.languages[state.currentLang] || auditJson.languages['en'];
        const container = document.getElementById('stepsContainer');
        container.innerHTML = '';
        renderJumpMenu(t);
        const section = t.sections[state.currentStep] || auditJson.languages['en'].sections[state.currentStep];
        const stepDiv = document.createElement('div');
        stepDiv.className = 'audit-step active';
        const tableRows = section.qs.map((item, qIdx) => `
            <tr>
                <td>
                    <div style="display:flex; align-items:center; ${state.currentLang === 'ar' ? 'flex-direction:row-reverse' : ''}">
                        <strong>${item.q}</strong>
                        <span class="help-icon" onclick="toggleHelp(${qIdx})">?</span>
                    </div>
                    <div id="help-${qIdx}" class="help-text">${item.h}</div>
                </td>
                <td style="text-align:center"><input type="radio" name="q_${qIdx}" onclick="updateLogic(${qIdx}, 'Pass')" ${state.auditData[state.currentStep].answers[qIdx] === 'Pass' ? 'checked' : ''}></td>
                <td style="text-align:center; white-space: nowrap;">
                    <div style="display: inline-flex; align-items: center; gap: 8px;">
                        <input type="radio" name="q_${qIdx}" onclick="updateLogic(${qIdx}, 'Fail')" ${state.auditData[state.currentStep].answers[qIdx] === 'Fail' ? 'checked' : ''}>
                        ${state.auditData[state.currentStep].answers[qIdx] === 'Fail' ? `
                            <span class="calendar-trigger ${document.getElementById('date_' + qIdx)?.value ? 'date-set' : ''}" 
                                  onclick="document.getElementById('date_${qIdx}').showPicker()" title="Set Deadline">📅</span>
                            <input type="date" id="date_${qIdx}" style="opacity:0; width:0; position:absolute;" onchange="initWizard()">
                        ` : ''}
                    </div>
                </td>
            </tr>`).join('');
        stepDiv.innerHTML = `
            <div class="section-card">
                <span class="section-title">${state.currentStep + 1}. ${section.title}</span>
                <table class="checklist-table">
                    <thead><tr><th>${t.requirement}</th><th>${t.pass}</th><th>${t.fail}</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>`;
        container.appendChild(stepDiv);
        updateUI(t);
    }

    function renderJumpMenu(t) {
        const menu = document.getElementById('jumpMenu');
        menu.innerHTML = t.sections.map((s, i) => `
            <button type="button" class="jump-btn ${i === state.currentStep ? 'active' : ''} ${state.auditData[i].status === 'Pass' ? 'completed' : state.auditData[i].status === 'Fail' ? 'failed-step' : ''}" 
            onclick="jumpToStep(${i})">${i + 1}</button>`).join('');
    }

    function jumpToStep(i) { state.currentStep = i; initWizard(); }

    function updateLogic(qIdx, result) {
        state.auditData[state.currentStep].answers[qIdx] = result;
        state.auditData[state.currentStep].status = state.auditData[state.currentStep].answers.includes('Fail') ? 'Fail' : state.auditData[state.currentStep].answers.every(a => a === 'Pass') ? 'Pass' : 'PENDING';
        initWizard();
    }

    function toggleHelp(qIdx) {
        const el = document.getElementById(`help-${qIdx}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function changeStep(n) {
        state.currentStep += n;
        initWizard();
    }

    function updateUI(t) {
        const percent = ((state.currentStep + 1) / t.sections.length) * 100;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('stepLabel').innerText = `Stage ${state.currentStep + 1}: ${t.sections[state.currentStep].title}`;
        document.getElementById('prevBtn').disabled = (state.currentStep === 0);
        document.getElementById('nextBtn').innerText = (state.currentStep === t.sections.length - 1) ? t.finalize : t.next;
    }

    async function saveAudit(status) {
        const roleEl = document.getElementById('auditRole');
        const payload = {
            serial: state.auditSerial,
            userEmail: state.userEmail,
            role: roleEl ? roleEl.value : 'SELF',
            orderNumber: document.getElementById('orderNumber').value,
            results: state.auditData.flatMap((section, sIdx) => 
                section.answers.map((ans, qIdx) => ({
                    section: auditJson.languages['en'].sections[sIdx].title,
                    q: auditJson.languages['en'].sections[sIdx].qs[qIdx].q,
                    res: ans,
                    followUpDate: ans === 'Fail' ? document.getElementById(`date_${qIdx}`)?.value : null
                }))
            )
        };
        const res = await fetch(API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload) 
        });
        if(res.ok) alert("Audit Synced to uk_rcc_dev.");
    }
